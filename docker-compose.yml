services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: shiftload-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shiftload
    ports:
      - "5433:5432"
    volumes:
      - shiftload-db:/var/lib/postgresql/data

volumes:
  shiftload-db:
